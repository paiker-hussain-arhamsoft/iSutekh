<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Products - Nature Republic</title>
    <link rel="icon" type="image/png" href="https://naturerepublic.ae/wp-content/uploads/2024/12/logo-e1733250622771.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        .category-header {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
        }
        
        .category-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .category-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .filters-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }
        
        .filter-group {
            margin-bottom: 1rem;
        }
        
        .filter-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #495057;
        }
        
        .sort-options {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .sort-btn {
            padding: 0.5rem 1rem;
            border: 2px solid #ff69b4;
            background: transparent;
            color: #ff69b4;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .sort-btn:hover, .sort-btn.active {
            background: #ff69b4;
            color: white;
        }
        
        .products-grid {
            min-height: 400px;
        }
        
        /* Ensure proper grid layout */
        #productsContainer {
            display: flex !important;
            flex-wrap: wrap;
        }
        
        #productsContainer .col-lg-3,
        #productsContainer .col-md-4,
        #productsContainer .col-sm-6 {
            display: block !important;
            float: none !important;
        }
        
        .product-card {
            height: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 1rem;
        }
        
        /* Force grid layout */
        .row {
            display: flex !important;
            flex-wrap: wrap !important;
            margin-right: -0.75rem !important;
            margin-left: -0.75rem !important;
        }
        
        .col-lg-3, .col-md-4, .col-sm-6 {
            padding-right: 0.75rem !important;
            padding-left: 0.75rem !important;
        }
        
        /* Additional grid fixes */
        @media (min-width: 992px) {
            .col-lg-3 {
                flex: 0 0 25% !important;
                max-width: 25% !important;
            }
        }
        
        @media (min-width: 768px) and (max-width: 991px) {
            .col-md-4 {
                flex: 0 0 33.333333% !important;
                max-width: 33.333333% !important;
            }
        }
        
        @media (min-width: 576px) and (max-width: 767px) {
            .col-sm-6 {
                flex: 0 0 50% !important;
                max-width: 50% !important;
            }
        }
        
        @media (max-width: 575px) {
            .col-sm-6 {
                flex: 0 0 100% !important;
                max-width: 100% !important;
            }
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
        }
        
        .product-image {
            height: 200px;
            overflow: hidden;
            border-radius: 10px 10px 0 0;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image img {
            transform: scale(1.05);
        }
        
        .product-info {
            padding: 1.5rem;
        }
        
        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .product-rating {
            color: #ffc107;
            margin-bottom: 0.5rem;
        }
        
        .product-description {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        
        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff69b4;
            margin-bottom: 1rem;
        }
        
        .pagination-container {
            margin-top: 3rem;
            text-align: center;
        }
        
        .page-info {
            margin-bottom: 1.5rem;
            color: #6c757d;
            font-size: 1.1rem;
        }
        
        .pagination-wrapper {
            display: flex;
            justify-content: center;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            color: #dee2e6;
            margin-bottom: 1rem;
        }
        
        .breadcrumb {
            background: transparent;
            padding: 0;
            margin-bottom: 1rem;
        }
        
        .breadcrumb-item a {
            color: #ff69b4;
            text-decoration: none;
        }
        
        .breadcrumb-item.active {
            color: #6c757d;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 2rem;
        }
        
        .spinner-border {
            color: #ff69b4;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://naturerepublic.ae/wp-content/uploads/2024/12/logo-e1733250622771.png" alt="Nature Republic" height="40" class="me-2">
                <span class="fw-bold">Nature Republic</span>
            </a>
            
            <div class="d-flex align-items-center">
                <a href="index.html" class="btn btn-outline-pink me-2">
                    <i class="fas fa-home"></i> Home
                </a>
                <div id="loginBtn">
                    <button class="btn btn-outline-pink" onclick="openLoginModal()">
                        <i class="fas fa-user"></i> Login
                    </button>
                </div>
                <button class="btn btn-pink ms-2" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count badge bg-white text-pink">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Category Header -->
    <div class="category-header">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" id="categoryBreadcrumb">Category</li>
                </ol>
            </nav>
            <div class="text-center">
                <h1 id="categoryTitle">Category Products</h1>
                <p id="categoryDescription">Discover our amazing collection</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Filters Section -->
        <div class="filters-section">
            <div class="row">
                <div class="col-md-4">
                    <div class="filter-group">
                        <label for="searchInput">Search Products</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by name or description...">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="filter-group">
                        <label>Price Range</label>
                        <div class="d-flex gap-2">
                            <input type="number" class="form-control" id="minPrice" placeholder="Min" min="0">
                            <input type="number" class="form-control" id="maxPrice" placeholder="Max" min="0">
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="filter-group">
                        <label>Sort By</label>
                        <div class="sort-options">
                            <button class="sort-btn active" data-sort="name" data-order="asc">Name A-Z</button>
                            <button class="sort-btn" data-sort="price" data-order="asc">Price Low-High</button>
                            <button class="sort-btn" data-sort="price" data-order="desc">Price High-Low</button>
                            <button class="sort-btn" data-sort="rating" data-order="desc">Rating</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid">
            <div id="loadingSpinner" class="loading-spinner">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading products...</p>
            </div>
            
            <div id="productsContainer" class="row" style="display: none;">
                <!-- Products will be dynamically loaded here -->
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-search"></i>
                <h4>No products found</h4>
                <p>Try adjusting your search criteria or filters</p>
                <button class="btn btn-pink" onclick="clearFilters()">Clear Filters</button>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination-container">
            <div class="page-info">
                <span id="pageInfo">Showing 0 of 0 products</span>
            </div>
            <div class="pagination-wrapper">
                <nav aria-label="Products pagination">
                    <ul class="pagination" id="pagination">
                        <!-- Pagination will be dynamically generated -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Shopping Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItems">
                        <!-- Cart items will be loaded here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="d-flex justify-content-between align-items-center w-100">
                        <h5>Total: <span id="cartTotal">AED 0.00</span></h5>
                        <button class="btn btn-pink" id="checkoutBtn">Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login/Register Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login / Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Register</button>
                        </li>
                    </ul>
                    
                    <div class="tab-content mt-3" id="authTabsContent">
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                </div>
                                <button type="submit" class="btn btn-pink w-100">Login</button>
                            </form>
                        </div>
                        
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="registerName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="registerName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="registerEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="registerEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="registerPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="registerPassword" required>
                                </div>
                                <button type="submit" class="btn btn-pink w-100">Register</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="category.js"></script>
</body>
</html>
